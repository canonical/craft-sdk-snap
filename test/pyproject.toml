[project]
name = "my-app"
version = "0.1.0"
description = "Sample Python app depending on pydantic, lxml, and cryptography"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8", "lxml>=6.1.0", "cryptography>=47.0.0"]

[project.scripts]
my-app = "my_app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
