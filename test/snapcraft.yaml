name: test-python-app
title: Test Python App
version: "0.1"
summary: Test consumer for craft-sdk build-snap
description: |
  Demonstrates consuming the craft-sdk build-snap to satisfy a Python
  project dependency on pydantic during snap build.

base: core24
confinement: strict

lint:
  ignore:
    - metadata

apps:
  test-python-app:
    command: venv/bin/python -m my_app

parts:
  # This part can be replaced with a `build-snaps` entry once
  # https://github.com/canonical/snapcraft/issues/4706 is complete.
  craft-sdk:
    plugin: nil
    source: .
    override-pull: |
      craftctl default

      # Assumes a copy of the craft-sdk snap has been placed in this test directory and
      # named 'craft-sdk-snap'. We omit the '.snap' suffix because snapcraft excludes
      # snap files from local sources.
      snap install $CRAFT_PART_SRC/craft-sdk-snap --dangerous

  app:
    plugin: nil
    source: .
    after: [craft-sdk]
    build-packages:
      - python3-venv
      - python3-pip
    override-build: |
      python3 -m venv "$CRAFT_PART_INSTALL/venv"
      VENV_PIP="$CRAFT_PART_INSTALL/venv/bin/pip"

      "$VENV_PIP" install --upgrade pip setuptools wheel

      # Install project deps from the provider build-snap wheels only.
      "$VENV_PIP" install --no-build-isolation --no-index --find-links="/snap/craft-sdk/current/wheels" "$CRAFT_PART_SRC"
