name: craft-sdk
version: '0.1'
summary: Prebuilt craft dependencies for use as a build-snap
description: |
  This snap contains prebuilt wheels for the pydantic Python library.
  It can be used as a build-snap to provide pydantic to other snaps
  at build time.

base: core24
confinement: strict

parts:
  annotated-types-wheel:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
      - python3-venv
    override-build: |
      set -eux

      mkdir -p "$CRAFT_PART_INSTALL/wheels"

      # Build annotated-types wheel from source distribution.
      python3 -m venv "$CRAFT_PART_BUILD/.venv"
      VENV_PY="$CRAFT_PART_BUILD/.venv/bin/python"
      VENV_PIP="$CRAFT_PART_BUILD/.venv/bin/pip"

      "$VENV_PIP" install --upgrade pip setuptools wheel
      "$VENV_PY" -m pip wheel --no-binary=:all: annotated-types==0.7.0 -w "$CRAFT_PART_INSTALL/wheels/"
    stage:
      - wheels/**
    prime:
      - wheels/**

  typing-extensions-wheel:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
      - python3-venv
    override-build: |
      set -eux

      mkdir -p "$CRAFT_PART_INSTALL/wheels"

      # Build typing-extensions wheel from source distribution.
      python3 -m venv "$CRAFT_PART_BUILD/.venv"
      VENV_PY="$CRAFT_PART_BUILD/.venv/bin/python"
      VENV_PIP="$CRAFT_PART_BUILD/.venv/bin/pip"

      "$VENV_PIP" install --upgrade pip setuptools wheel
      "$VENV_PY" -m pip wheel --no-binary=:all: typing-extensions==4.15.0 -w "$CRAFT_PART_INSTALL/wheels/"
    stage:
      - wheels/**
    prime:
      - wheels/**

  typing-inspection-wheel:
    plugin: nil
    source: .
    build-packages:
      - python3-pip
      - python3-venv
    override-build: |
      set -eux

      mkdir -p "$CRAFT_PART_INSTALL/wheels"

      # Build typing-inspection wheel from source distribution.
      python3 -m venv "$CRAFT_PART_BUILD/.venv"
      VENV_PY="$CRAFT_PART_BUILD/.venv/bin/python"
      VENV_PIP="$CRAFT_PART_BUILD/.venv/bin/pip"

      "$VENV_PIP" install --upgrade pip setuptools wheel
      "$VENV_PY" -m pip wheel --no-binary=:all: typing-inspection==0.4.2 -w "$CRAFT_PART_INSTALL/wheels/"
    stage:
      - wheels/**
    prime:
      - wheels/**

  pydantic-core-wheel:
    plugin: nil
    source: https://github.com/pydantic/pydantic
    source-type: git
    source-tag: v2.13.4
    build-snaps:
      - rustup
    build-packages:
      - python3-pip
      - python3-venv
      - git
    override-build: |
      set -eux

      mkdir -p "$CRAFT_PART_INSTALL/wheels"

      # Build pydantic-core wheel from source using an isolated venv.
      python3 -m venv "$CRAFT_PART_BUILD/.venv"
      VENV_PY="$CRAFT_PART_BUILD/.venv/bin/python"
      VENV_PIP="$CRAFT_PART_BUILD/.venv/bin/pip"
      CORE_SRC="$CRAFT_PART_SRC/pydantic-core"

      # Use rustup from the build-snap for a modern cargo toolchain.
      export PATH="/snap/rustup/current/bin:$PATH"
      rustup toolchain install stable --profile minimal
      rustup default stable
      cargo --version

      if [ ! -d "$CORE_SRC" ]; then
        echo "pydantic-core source directory not found: $CORE_SRC"
        exit 1
      fi

      "$VENV_PIP" install --upgrade pip setuptools wheel build
      "$VENV_PY" -m build --wheel --outdir "$CRAFT_PART_INSTALL/wheels/" "$CORE_SRC"

      if ! ls "$CRAFT_PART_INSTALL/wheels"/pydantic_core-*.whl >/dev/null 2>&1; then
        echo "Expected pydantic_core wheel was not produced"
        ls -la "$CRAFT_PART_INSTALL/wheels/"
        exit 1
      fi
    stage:
      - wheels/**
    prime:
      - wheels/**

  pydantic-wheel:
    plugin: nil
    source: https://github.com/pydantic/pydantic
    source-type: git
    source-tag: v2.13.4
    after:
      - annotated-types-wheel
      - typing-extensions-wheel
      - typing-inspection-wheel
      - pydantic-core-wheel
    build-packages:
      - python3-pip
      - python3-venv
      - git
    override-build: |
      set -eux

      mkdir -p "$CRAFT_PART_INSTALL/wheels"

      # Build pydantic wheel from source using an isolated venv.
      python3 -m venv "$CRAFT_PART_BUILD/.venv"
      VENV_PY="$CRAFT_PART_BUILD/.venv/bin/python"
      VENV_PIP="$CRAFT_PART_BUILD/.venv/bin/pip"

      "$VENV_PIP" install --upgrade pip setuptools wheel build
      "$VENV_PIP" install --no-deps --no-index --find-links="$CRAFT_STAGE/wheels" pydantic-core
      "$VENV_PY" -m build --wheel --outdir "$CRAFT_PART_INSTALL/wheels/" "$CRAFT_PART_SRC"
    stage:
      - wheels/**
    prime:
      - wheels/**
