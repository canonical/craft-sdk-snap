name: Tests for craft-sdk

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout craft-sdk
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build craft-sdk snap
        uses: canonical/craft-actions/snapcraft/pack@67304fab78ef627dc3f2e72c8a6ad51a493a6070 # main as of 2026-06-11

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: craft-sdk-snap
          path: craft-sdk*.snap


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout craft-sdk
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download craft-sdk snap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: craft-sdk-snap

      - name: Build the test snap
        uses: canonical/craft-actions/snapcraft/pack@67304fab78ef627dc3f2e72c8a6ad51a493a6070 # main as of 2026-06-11
        with:
          path: test

      - name: Test the test snap
        run: |
          sudo snap install ./test-python-app_0.1_amd64.snap --dangerous
          snap run test-python-app.my-app
