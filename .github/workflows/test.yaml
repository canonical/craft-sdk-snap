name: Tests for craft-sdk

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout craft-sdk
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build craft-sdk snap
        uses: canonical/craft-actions/snapcraft/pack@67304fab78ef627dc3f2e72c8a6ad51a493a6070 # main as of 2026-06-11

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: craft-sdk-snap
          path: craft-sdk*.snap

  test:
    # matches the base of the test snap
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout craft-sdk
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download craft-sdk snap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: craft-sdk-snap

      - name: Install the craft-sdk snap
        run: |
          sudo snap install craft-sdk*.snap --dangerous

      - name: Build the test snap
        run: |
          sudo snap install snapcraft --classic

          cd test
          # we do a destructive build since we can't inject snaps into a build environment
          # see https://github.com/canonical/snapcraft/issues/4706
          snapcraft pack --destructive-mode --verbosity=trace

          # test that snapcraft didn't refresh channels
          snap info craft-sdk
          exit 1

      - name: Test the test snap
        run: |
          sudo snap install ./test/test-python-app*.snap --dangerous

          output=$(test-python-app)
          echo "$output"

          if ! grep -q "Validation works:" <<< "$output"; then
            echo "Error: expected 'Validation works:' in output"
            exit 1
          fi
